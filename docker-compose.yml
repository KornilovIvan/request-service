services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: requests
      POSTGRES_PASSWORD: requests
      POSTGRES_DB: requests
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U requests -d requests"]
      interval: 2s
      timeout: 5s
      retries: 20

  migrate:
    image: migrate/migrate:v4.18.2
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["migrate"]
    profiles: ["tools"]

  app:
    build: .
    environment:
      DATABASE_URL: postgres://requests:requests@postgres:5432/requests?sslmode=disable
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
